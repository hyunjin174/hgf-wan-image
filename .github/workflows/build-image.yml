# Dockerfile 로 이미지를 만들어 Docker Hub 에 올린다.
# 필요한 저장소 Secrets (Settings → Secrets and variables → Actions):
#   DOCKERHUB_USERNAME : Docker Hub 아이디
#   DOCKERHUB_TOKEN    : Docker Hub → Account settings → Personal access tokens (Read & Write)
# 실행: Dockerfile/requirements 를 push 하면 자동, 또는 Actions 탭 → Run workflow.
# (저장소는 공개 — 계정 결제가 잠겨 있으면 비공개 저장소의 Actions 는 돌지 않는다)
name: build-image

on:
  push:
    branches: [main]
    paths: [Dockerfile, requirements-wan.txt, .github/workflows/build-image.yml]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      # 기본 러너는 디스크가 ~14GB 뿐 — pytorch CUDA 이미지(풀면 ~10GB)를 받으려면 비워야 한다
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost /usr/local/.ghcup /usr/share/swift || true
          sudo docker image prune --all --force || true
          df -h /

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/hgf-wan:v1
            ${{ secrets.DOCKERHUB_USERNAME }}/hgf-wan:latest

      - name: Image name for deploy/docker/image.txt
        run: echo "${{ secrets.DOCKERHUB_USERNAME }}/hgf-wan:v1"
